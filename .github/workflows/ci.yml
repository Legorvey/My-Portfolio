name: CI

on:
  push:
    branches:
      - main
      - v2
  pull_request:
    branches:
      - main
      - v2
  workflow_dispatch:

# Enforce least-privilege token permissions globally
permissions:
  contents: read

# Cancel redundant in-progress runs on pull requests when new commits are pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  quality:
    name: Quality Gates (Lint, Typecheck, Test, Build, Audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies (clean)
        run: npm ci

      - name: Cache Next.js build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.ts', '**/*.tsx', '**/*.css', '**/*.mdx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Gate 1 - ESLint
        run: npm run lint

      - name: Gate 2 - TypeScript Typecheck
        run: npm run typecheck

      - name: Gate 3 - Vitest Test Suite
        run: npm run test:ci

      - name: Gate 4 - Next.js Production Build
        env:
          NEXT_PUBLIC_ENABLE_CASE_STUDIES: "true"
        run: npm run build

      - name: Gate 5 - Security Audit (High & Critical)
        run: npm audit --audit-level=high
